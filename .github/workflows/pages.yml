name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main", "pre-release"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Prepare Pages content
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          rm -rf public/${BRANCH_NAME}
          mkdir -p public/${BRANCH_NAME}
          cp -r doc public/${BRANCH_NAME}/
          cp -r simulator public/${BRANCH_NAME}/
          cp -r api public/${BRANCH_NAME}/
          cp -r integration_kits public/${BRANCH_NAME}/
          find "public/${BRANCH_NAME}" -maxdepth 5 -type f -print

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
